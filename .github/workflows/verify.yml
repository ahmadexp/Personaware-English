name: Verify release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install image and DOS tools
        run: sudo apt-get update && sudo apt-get install --yes imagemagick mtools nasm

      - name: Verify release artifact and sources
        run: ./scripts/verify_release.sh
